<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Risk & Compliance Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0A0E1A] text-slate-100" style="font-family: 'IBM Plex Sans', sans-serif;">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid } = Recharts;

    const modules = ['Executive Overview','LTV Monitor','AML Surveillance','End-Use Monitor','Auction Pipeline','KYC Status','Regulatory Reporting','AI Playbooks'];

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      if (!response.ok) throw new Error('Request failed');
      return response.json();
    }

    function App() {
      const [module, setModule] = useState('Executive Overview');
      const [feed, setFeed] = useState([]);
      const [gold, setGold] = useState(71240);
      const [chat, setChat] = useState('');
      const [answer, setAnswer] = useState('');

      useEffect(() => {
        loadFeed();
      }, []);

      async function loadFeed() {
        const rows = await api('/api/ai-feed');
        setFeed(rows.map((r) => r.message));
      }

      async function recordAction(actionType, payload = {}) {
        await api('/api/actions', { method: 'POST', body: JSON.stringify({ actionType, payload }) });
      }

      async function runCrash() {
        setGold(67678);
        await api('/api/alerts', {
          method: 'POST',
          body: JSON.stringify({
            module: 'LTV Monitor',
            severity: 'critical',
            message: 'Portfolio breach event during crash simulation. 892 → 2,340 accounts in breach.'
          })
        });
        await api('/api/ai-feed', {
          method: 'POST',
          body: JSON.stringify({ message: `[${new Date().toLocaleTimeString()}] Crash simulation triggered — AI Playbook activated.` })
        });
        await recordAction('gold_crash_simulated', { from: 71240, to: 67678 });
        loadFeed();
      }

      async function askAI() {
        const key = chat.trim().toLowerCase();
        let text = 'Try: "What\'s our Kerala exposure if gold drops 10%?"';
        if (key.includes('kerala') && key.includes('10%')) {
          text = 'If MCX gold falls 10% (₹71,240 → ₹64,116), 8,420 Kerala accounts may breach 75% LTV with ~₹1,240 Cr exposure. Top branch risk: Thrissur Main, Ernakulam Central, Kozhikode.';
        }
        if (key.includes('str') && key.includes('gl-004821')) {
          text = 'STR Draft ready for GL-004821 (Suresh Menon): 3 structured deposits totaling ₹9.5L across consecutive days, indicative of structuring pattern below CTR threshold.';
        }
        setAnswer('');
        let i = 0;
        const timer = setInterval(() => {
          i += 1;
          setAnswer(text.slice(0, i));
          if (i >= text.length) clearInterval(timer);
        }, 18);

        await recordAction('ai_query', { query: chat, response: text });
        await api('/api/ai-feed', {
          method: 'POST',
          body: JSON.stringify({ message: `[${new Date().toLocaleTimeString()}] AI Query handled: ${chat}` })
        });
        loadFeed();
      }

      const bands = [
        { name: '<65%', value: 142000, fill: '#10B981' },
        { name: '65–70%', value: 98000, fill: '#10B981' },
        { name: '70–73%', value: 31000, fill: '#F59E0B' },
        { name: '73–75%', value: 9824, fill: '#F97316' },
        { name: '>75%', value: gold === 67678 ? 8240 : 3892, fill: '#EF4444' },
      ];

      return (
        <div className="h-screen flex flex-col">
          <header className="border-b border-slate-700 bg-[#0D1322] px-4 py-3 flex justify-between items-center">
            <div className="text-amber-400 font-semibold">⬡ GoldShield AI — Risk & Compliance Dashboard</div>
            <div className="font-mono text-sm">MCX Gold: ₹{gold.toLocaleString('en-IN')}/10g</div>
          </header>
          <div className="flex flex-1">
            <aside className="w-64 border-r border-slate-700 p-3 bg-[#0C1220]">
              {modules.map((m) => (
                <button key={m} onClick={() => setModule(m)} className={`w-full text-left p-2 mb-1 rounded ${module===m?'bg-slate-800 border border-amber-500':'hover:bg-slate-900'}`}>{m}</button>
              ))}
            </aside>
            <main className="flex-1 p-4 overflow-auto">
              <div className="grid grid-cols-3 gap-3 mb-3">
                <div className="bg-slate-900 border border-slate-700 rounded p-3"><div>Total AUM</div><div className="text-2xl font-mono">₹4,820 Cr</div></div>
                <div className="bg-slate-900 border border-slate-700 rounded p-3"><div>Active Loans</div><div className="text-2xl font-mono">2,84,716</div></div>
                <div className="bg-slate-900 border border-slate-700 rounded p-3"><div>Inspection Readiness</div><div className="text-2xl font-mono">84%</div></div>
              </div>
              <div className="bg-slate-900 border border-slate-700 rounded p-3 mb-3">
                <div className="flex justify-between mb-2"><div className="text-indigo-300">{module}</div><button onClick={runCrash} className="bg-red-500 px-3 py-1 rounded text-sm">Simulate Gold Crash</button></div>
                <div className="h-64"><ResponsiveContainer><BarChart data={bands}><CartesianGrid stroke="#1F2937" /><XAxis dataKey="name" stroke="#9ca3af" /><YAxis stroke="#9ca3af" /><Tooltip /><Bar dataKey="value" /></BarChart></ResponsiveContainer></div>
              </div>
              <div className="bg-slate-900 border border-indigo-400 rounded p-3">
                <div className="text-indigo-300">⬡ AI RESPONSE</div>
                <div className="min-h-16 mt-2 text-sm">{answer || 'Ask the compliance AI for risk projections, STR draft, and auction overdues.'}</div>
                <div className="flex gap-2 mt-2">
                  <input value={chat} onChange={(e)=>setChat(e.target.value)} className="flex-1 bg-slate-950 border border-slate-700 rounded px-2 py-1" placeholder="Ask the Compliance AI..." />
                  <button onClick={askAI} className="bg-indigo-500/30 border border-indigo-400 rounded px-3">Send</button>
                </div>
              </div>
            </main>
            <aside className="w-80 border-l border-slate-700 p-3 bg-[#0C1220]">
              <div className="text-indigo-300 mb-2">⬡ AI INTELLIGENCE FEED (Persisted)</div>
              <div className="space-y-2 max-h-[80vh] overflow-auto">
                {feed.map((item, i) => <div key={i} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm">{item}</div>)}
              </div>
            </aside>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
